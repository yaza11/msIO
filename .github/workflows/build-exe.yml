name: Build Windows executables

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msIO_AnnotationGUI
            script: msIO/gui/find_lib_matches.py
          - name: msIO_LibrarySearch
            script: msIO/gui/library_search_by_name.py
          - name: msIO_CSVtoSQLite
            script: msIO/gui/csv_to_sqlite_gui.py
          - name: msIO_GUI
            script: msIO/gui/main.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller IsoSpecPy
          pip install git+https://github.com/yaza11/LipidCalculator.git

      - name: Locate IsoSpec DLL
        shell: pwsh
        run: |
          $sp = python -c "import site; print(site.getsitepackages()[0])"
          $dll = Get-ChildItem -Path $sp -Recurse -Filter "IsoSpecCppPy.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Write-Host "Found $($dll.FullName)"
            "ISO_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "IsoSpecCppPy.dll not found, building without it"
          }

      - name: Build executable
        shell: pwsh
        run: |
          $piArgs = @("--noconfirm", "--clean", "--onedir", "--windowed",
                      "--name", "${{ matrix.name }}", "--paths", ".",
                      "--runtime-hook", "msIO/gui/_gui_log.py",
                      "--collect-all", "matchms",
                      "--collect-all", "LipidCalculator",
                      "--collect-all", "IsoSpecPy",
                      "--hidden-import", "scipy._external.array_api_compat.numpy.fft")
          if ($env:ISO_DLL) { $piArgs += @("--add-binary", "$($env:ISO_DLL);bin") }
          $piArgs += "${{ matrix.script }}"
          python -m PyInstaller @piArgs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

      - name: Zip build for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.name }}" -DestinationPath "${{ matrix.name }}-windows.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}-windows.zip