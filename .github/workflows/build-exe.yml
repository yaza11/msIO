
name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Python package (sdist + wheel) for PyPI, built on every run so packaging errors show up early
  dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches msIO/_version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('msIO/_version.py')['__version__'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $version in msIO/_version.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msIO_GUI  # must match NAME in LipidAnnotations.spec

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller IsoSpecPy
          pip install git+https://github.com/yaza11/LipidCalculator.git@v0.3.7

      # all build options (data files, IsoSpec library, runtime hook, ...) are in the spec, shared with local builds
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LipidAnnotations.spec

      - name: Zip build for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/${{ matrix.name }}" `
            -DestinationPath "${{ matrix.name }}-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

      - name: Upload release ZIP
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.name }}-windows.zip
          if-no-files-found: error

  release:
    needs: [dist, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          generate_release_notes: true

  # Upload to PyPI via trusted publishing (no token needed). Needs a (pending) publisher on pypi.org for
  # repository yaza11/msIO, workflow build-exe.yml and environment "pypi". Only after the exe built, so a
  # release is published everywhere or nowhere; PyPI never accepts the same version twice.
  pypi:
    needs: [dist, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msIO
    permissions:
      id-token: write

    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
